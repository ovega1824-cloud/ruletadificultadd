name: Compilar mod

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10

      - name: Compilar
        run: gradle build --no-daemon

      - name: Guardar el .jar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ruleta-dificultad-jar
          path: build/libs/ruleta-dificultad-*.jar

      - name: Publicar el .jar en Releases
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Ruleta de Dificultad (última versión)
          body: Descarga el archivo .jar de abajo y ponlo en la carpeta mods (Fabric 1.21.1 + Fabric API).
          artifacts: build/libs/ruleta-dificultad-*.jar
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          commit: ${{ github.sha }}
